[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronelab"
version = "0.2.0"
description = "CPU-only quadrotor autonomy stack: control, learned dynamics, autonomous gate flight, state estimation and vision – each with its own fair benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"  # gym-pybullet-drones needs 3.12+
dependencies = [
    "numpy",
    "scipy",
    "pybullet",
    "gymnasium",
    "stable-baselines3",
    "torch",
    "matplotlib",
    "pyyaml",
    "pydantic>=2",
    "imageio",
    "optuna",
    "numba",  # fast surrogate physics for MPPI rollouts (surrogate/fast.py)
    # Simulator: installed from GitHub, see README / CI
    # "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones.git",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: tests that need gym-pybullet-drones / PyBullet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
