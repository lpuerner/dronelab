# Stage 1 benchmark: classical controllers, reduced to 5 test seeds.
name: stage1
controllers: [dsl_pid, pid, lqr, lqi]
params_dir: results/tuning        # <params_dir>/<controller>/best_params.yaml (if present)
seeds: [1000, 1001, 1002, 1003, 1004]

# Part A - difficulty: speed sweep, nominal conditions
part_a:
  families: [figure8, helix, waypoints, gates]
  speeds: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0]   # 2.0 / 3.0 = extrapolation beyond tuning range
  hover: true

# Part B - disturbances: all 21 scenarios at 1 m/s
part_b:
  families: [hover, figure8, gates]
  speed: 1.0
  scenarios: all
